<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Meesho</title>
    <meta name="description" content="A mobile-first UI base architecture." />

    <!-- Makes the app feel native + installable on phones -->
    <!-- Browser chrome color: the light default, plus a dark-scheme override
         so an OS-level dark theme is respected. An explicit in-app dark
         choice on a light device keeps the default (this meta cannot react
         to that; see js/theme-init.js). -->
    <meta name="theme-color" content="#570d48" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meesho" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />

    <!-- Ordered cascade: reset → tokens → base → layout → components → responsive -->
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />

    <!-- Apply the stored/preferred theme before the first paint to avoid a
         flash of the wrong theme. This must stay a classic script:
         type="module" scripts are deferred and would run after the paint. -->
    <script src="./js/theme-init.js"></script>
  </head>
  <body>
    <div class="app">
      <!-- Header is injected by js/components/header.js -->
      <div id="app-header"></div>

      <main class="app-main" id="app-main">
        <!-- Full-bleed hero banner. The banner image carries the promo
             message, so the page keeps a real <h1> for assistive tech only
             and the image itself is marked decorative (alt="") to avoid
             announcing the same text twice.

             #hero-spin is the slot for the "Spin & Win" wheel: js/pages/
             home.js mounts the wheel and its result line into it, and they take
             the third and the fourth of the banner's four parts (part 3 is
             where the artwork turns into a flat plate), so nothing is cropped. -->
        <h1 class="sr-only">Meesho Gold — Products you Love. Quality we Trust.</h1>

        <section class="page-section hero">
          <img
            class="hero__img"
            src="./assets/main.png"
            alt=""
            width="1920"
            height="532"
            fetchpriority="high"
          />
          <div id="hero-spin"></div>
        </section>

        <section class="page-section" aria-labelledby="products-heading">
          <div class="page-head">
            <h2 class="page-head__title" id="products-heading">
              Products for You
            </h2>
            <p class="page-head__subtitle">
              Fashion on top, then the rest — each price low to high. Free
              delivery on every order.
            </p>
          </div>
          <div
            id="product-grid"
            class="grid grid--2 grid--3 grid--4 product-grid"
          ></div>
          <p
            id="product-status"
            class="product-status text-muted"
            role="status"
            aria-live="polite"
          ></p>
          <div id="product-sentinel" aria-hidden="true"></div>
          <noscript>
            <p class="text-muted">
              Enable JavaScript to browse the product listing.
            </p>
          </noscript>
        </section>

        <section
          class="page-section"
          aria-labelledby="toys-heading"
          id="toys-section"
          hidden
        >
          <div class="page-head">
            <h2 class="page-head__title" id="toys-heading">Toys & Gifts</h2>
            <p class="page-head__subtitle">
              Sports, playtime and gift picks with real photos — same
              budget prices.
            </p>
          </div>
          <div class="toys-scroller" id="toys-track" tabindex="0"></div>
        </section>
      </main>

      <!-- Footer is injected by js/components/footer.js -->
      <div id="app-footer"></div>
    </div>

    <!-- Bottom navigation is injected by js/components/bottomNav.js -->
    <div id="app-bottom-nav"></div>

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/pages/home.js"></script>
  </body>
</html>
